name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-dev.txt
      - run: pip install -r service/requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fire-vision service
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 7860:7860 fire-vision
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 1; done
          curl -sf -F "file=@service/public/samples/forest-burn.jpg" localhost:7860/api/detect \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(len(r['detections']), 'boxes'); assert r['fire_detected']"
          curl -sf -F "file=@service/public/samples/forest-burn-pan.mp4" "localhost:7860/api/detect/video?sample_fps=2" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['positive_frames'], 'positive frames'); assert r['frames_analysed'] > 0"
      - if: failure()
        run: docker logs api
